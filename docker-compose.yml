services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: file:/data/dev.db
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api-sqlite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  api-sqlite-data:
